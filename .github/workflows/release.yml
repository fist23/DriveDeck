name: Android release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag da release a publicar"
        required: true
        default: "v0.9.1"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref_name }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Validate release signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.DRIVEDECK_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.DRIVEDECK_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.DRIVEDECK_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.DRIVEDECK_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "Missing DRIVEDECK_KEYSTORE_BASE64" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing DRIVEDECK_KEY_ALIAS" && exit 1)
          test -n "$STORE_PASSWORD" || (echo "Missing DRIVEDECK_STORE_PASSWORD" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing DRIVEDECK_KEY_PASSWORD" && exit 1)

      - name: Restore stable release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.DRIVEDECK_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | tr -cd 'A-Za-z0-9+/=' | base64 --decode > "$RUNNER_TEMP/drivedeck-release.jks"

      - name: Build signed APK
        env:
          DRIVEDECK_KEYSTORE_PATH: ${{ runner.temp }}/drivedeck-release.jks
          DRIVEDECK_KEY_ALIAS: ${{ secrets.DRIVEDECK_KEY_ALIAS }}
          DRIVEDECK_STORE_PASSWORD: ${{ secrets.DRIVEDECK_STORE_PASSWORD }}
          DRIVEDECK_KEY_PASSWORD: ${{ secrets.DRIVEDECK_KEY_PASSWORD }}
        run: gradle :app:assembleRelease

      - name: Verify APK signature
        run: apksigner verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" app/build/outputs/apk/release/app-release.apk --clobber
          else
            gh release create "$RELEASE_TAG" app/build/outputs/apk/release/app-release.apk --title "DriveDeck $RELEASE_TAG" --generate-notes
          fi
